name: ClipSave Android APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'ClipSave/mobile/**'
      - 'ClipSave/backend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: write
    env:
      BOT: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DART_SUPPRESS_ANALYTICS: 'true'
    steps:
      - name: Report build start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --raw-field state=pending --raw-field 'context=ClipSave Android APK' \
            --raw-field "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the backend
        working-directory: ClipSave/backend
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          python -m pip install -r requirements.txt
          python -m unittest -v
      - name: Set up Flutter
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fLsS --retry 3 https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.50.1-stable.tar.xz -o "$archive"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          rm "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install Android build dependencies
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$sdkmanager" --licenses >/dev/null)
          "$sdkmanager" 'platforms;android-35' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.10.2.4988404'
      - name: Test and build ClipSave
        working-directory: ClipSave/mobile
        run: |
          chmod +x android/gradlew
          flutter --suppress-analytics pub get --enforce-lockfile
          flutter --suppress-analytics analyze --no-pub
          flutter --suppress-analytics test --no-pub
          dart --suppress-analytics run test/direct_media_smoke.dart
          flutter --suppress-analytics build apk --debug --no-pub --target-platform android-arm64
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/ClipSave-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ClipSave-android-arm64
          path: ${{ runner.temp }}/ClipSave-android-arm64.apk
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClipSave-android-arm64
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-test-${{ github.run_number }}" ClipSave-android-arm64.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "ClipSave Android test build ${{ github.run_number }}" \
            --notes "Install the APK on a 64-bit ARM Android phone. Start the ClipSave backend and enter its address in Settings. See ClipSave/README.md for setup. This APK is debug-signed for testing local HTTP."

  report:
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      statuses: write
    steps:
      - name: Report release result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESULT: ${{ needs.publish.result }}
        run: |
          state=failure
          target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$RELEASE_RESULT" = success ]; then
            state=success
            target="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/android-test-$GITHUB_RUN_NUMBER"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --raw-field "state=$state" --raw-field 'context=ClipSave Android APK' \
            --raw-field "target_url=$target"
